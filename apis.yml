aid: aadyasecurity
name: AaDya Security (Judy Security)
description: 'AaDya Security, founded in 2019 by Raffaele Mautone and rebranded in 2023
  around its product as Judy Security, sells an all-in-one AI-driven cybersecurity
  platform to small and midsize businesses, schools, non-profits and public-sector
  buyers, almost entirely through MSP and MSSP partners. The Judy platform bundles
  endpoint detection and response, DNS filtering, a password manager, a cloud SIEM
  and XDR ("Blue Team"), automated compliance management and reporting, secure and
  passwordless authentication, and security awareness training behind a single
  Control Center. The company publishes no developer program, no public API
  reference and no machine-readable API contract; its documented API surface is
  outbound only - configuration guides for pushing Judy Portal tickets into
  ConnectWise PSA and Datto Autotask using those vendors'' APIs. It does operate a
  public Atlassian Statuspage for the platform.'
